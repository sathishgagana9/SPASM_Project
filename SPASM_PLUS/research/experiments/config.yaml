# Experiment configuration. Edit this instead of hard-coding values
# in the experiment scripts (spec section 15: "same model,
# temperature, token limits ... whenever possible" across baselines).

models:
  # Cross-family evaluation. Verify availability/permissions immediately
  # before a run because hosted model catalogs change.
  - provider: groq
    model: openai/gpt-oss-20b
    label: gpt_oss_20b
  - provider: groq
    model: openai/gpt-oss-120b
    label: gpt_oss_120b
  - provider: groq
    model: qwen/qwen3.8-27b
    label: qwen3_8_27b
  - provider: groq
    model: minimaxai/minimax-m2.7
    label: minimax_m2_7

generation:
  temperature: 0.7

personas_file: ../../backend/app/seed_data/personas.json
dataset:
  prompts: ../datasets/prompts.jsonl
  adversarial: ../datasets/adversarial_prompts.jsonl
  multiturn: ../datasets/multiturn_scenarios.jsonl

multiturn_experiment:
  turn_counts: [1, 5, 10, 20, 50, 100]

output_dir: ../results/raw
